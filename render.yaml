services:
  - type: web
    name: opsbridge-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: demo
      - key: COOKIE_SECURE
        value: "true"
      # The public URL is added after Render assigns the service URL. Demo mode
      # temporarily falls back to the incoming Host header during first deploy.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # Render's container filesystem is intentionally ephemeral for this demo.
      - key: DATABASE_URL
        value: sqlite:///./data/opsbridge.db
